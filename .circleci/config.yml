version: 2.1

jobs:
  build:
    docker:
      # Pinned. `node:lts` floats, so the image changed under a project frozen on
      # Create React App 3 every time a new LTS shipped. 12 is this project's era, and
      # Create React App 3 needs it: webpack 4 asks OpenSSL for MD4, which fails on
      # Node 17+ with ERR_OSSL_EVP_UNSUPPORTED.
      - image: cimg/node:12.22
    steps:
      - checkout
      # npm ci, not npm install: exactly what package-lock.json pins.
      - run: npm ci
      - run: npm run lint
      # Was commented out, because the test could not pass without its providers.
      - run:
          name: Test
          command: npm test -- --watchAll=false
      # CI deliberately NOT set to false: Create React App treats warnings as errors
      # when it is set, and that is what a pipeline is for.
      - run: npm run build
